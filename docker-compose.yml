services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CACHE_TTL_SECONDS: "3600"
      COMPLEXITY_WORD_THRESHOLD: "150"
      UPSTREAM_TIMEOUT_SECONDS: "30"
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
