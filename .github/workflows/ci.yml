name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel an older run of this workflow on the same pull request.
# Pushes use a unique group so a main run is not cancelled by the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python-version }}
          enable-cache: "false"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check app tests

      - name: Format
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy app

      - name: Audit dependencies
        # Hashed export of the locked tree (runtime + default dev group), without
        # the local project. --disable-pip audits those pins directly. The default
        # pip-audit path builds a temporary venv with ensurepip, which fails on
        # uv's CPython 3.10.
        run: uv export --frozen --no-emit-project | uv run pip-audit -r /dev/stdin --progress-spinner off --disable-pip

      - name: Test
        # Branch coverage stays above 90 on Python 3.10, 3.12, and 3.13.
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90
