version: 2
updates:
  # Pip-compatible project. The uv ecosystem updates uv.lock (and pyproject ranges).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
