name: Bug report
description: A defect in the local demo
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, tokens, or `.env` contents.
        A vulnerability belongs in private reporting, not this form.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected, and what you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: main
