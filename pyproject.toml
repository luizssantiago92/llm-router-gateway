[build-system]
requires = ["setuptools>=68,<100"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router-gateway"
version = "0.1.0"
description = "Demo FastAPI gateway: OpenAI-shaped chat facade, Redis cache, Gemini, optional Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1",
    "httpx>=0.27.0,<1",
    "redis>=5.0.0,<9",
    "pydantic>=2.0.0,<3",
    "uvicorn>=0.32.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10",
    "pytest-asyncio>=0.24.0,<2",
    "pytest-cov>=6.0.0,<8",
    "mypy>=1.13.0,<3",
    "pip-audit>=2.7.0,<3",
    "PyYAML>=6.0.0,<7",
    "ruff>=0.9.0,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: tests that call real upstream providers",
]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "S",
    "ASYNC",
    "SIM",
    "RUF",
    "BLE",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["app"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
