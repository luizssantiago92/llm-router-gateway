# Project guardrails config (extends preset: python-platform)
extends: python-platform

context: |
  Product: LLM Router Gateway — demonstrative FastAPI facade (cache, routing, Gemini free-tier demo).
  Kickoff: prd.md
  Demo posture: Gemini + X-API-Key + daily quota; Ollama optional. Not the production company chatbot.
  Agent backlog: README.md section "Still open (agents: read this)".
  Reuse: Gold Queen / future company chatbot may lift patterns; keep this repo as the lab demo.
  Test command: pytest
  Branch prefix: feat
  Docs: README.md + docs/ must stay current on every PR (C-008).

commit:
  # Vendored Spec Guardrails skills + Python gates exceed the 500-line default
  # on install/upgrade. Feature commits should stay far below this ceiling.
  max_staged_lines: 8000
